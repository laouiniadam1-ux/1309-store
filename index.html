}

}

var GH_KEY='s1309_gh';
function ghLoad(){try{return JSON.parse(localStorage.getItem(GH_KEY))||{}}catch(e){return{}}}

function ghHeaders(token){return {'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
function b64utf8(str){var bytes=new TextEncoder().encode(str);var bin='';for(var i=0;i<bytes.length;i+=0x8000){bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000))}return btoa(bin)}
function readGhForm(){

 st.textContent='Test…';st.className='ghstat';
 fetch('https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo),{headers:ghHeaders(c.token)}).then(function(r){
  if(r.ok){st.textContent='OK — repo « '+c.owner+'/'+c.repo+' » trouvé.';st.className='ghstat good'}
  else if(r.status===401||r.status===403){st.textContent='Token refusé (HTTP '+r.status+').';st.className='ghstat bad'}
  else if(r.status===404){st.textContent='Repo introuvable (404) — vérifie owner/repo et l’accès du token.';st.className='ghstat bad'}

 }).catch(function(){st.textContent='Échec réseau.';st.className='ghstat bad'});

function publish(){
 if(A.busy||!A.dirty)return;
 var c=ghLoad();
 if(!c.owner||!c.repo||!c.token){A.msg='Configure d’abord « Réglages GitHub » ci-dessous (owner, repo, token).';A.view='list';return renderAdmin()}
 var doc=buildDoc();
 if(doc.length>900000){A.msg='Fichier trop lourd (~'+(doc.length/1048576).toFixed(1)+' Mo) pour l’API GitHub (max ~1 Mo). Réduis le nombre ou la taille des photos.';return renderAdmin()}
 A.busy=true;A.msg='';renderAdmin();
 var branch=c.branch||'main';
 var path=(c.path||'index.html').replace(/^\/+/,'');
 var api='https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/contents/'+path.split('/').map(encodeURIComponent).join('/');
 fetch(api+'?ref='+encodeURIComponent(branch),{headers:ghHeaders(c.token)}).then(function(r){
  if(r.status===404)return {sha:null};
  if(!r.ok)throw {status:r.status};
  return r.json().then(function(j){return {sha:j.sha}});
 }).then(function(cur){
  var body={message:'1309: mise à jour de la boutique',content:b64utf8(doc),branch:branch};
  if(cur.sha)body.sha=cur.sha;
  return fetch(api,{method:'PUT',headers:Object.assign(ghHeaders(c.token),{'Content-Type':'application/json'}),body:JSON.stringify(body)});
 }).then(function(r){
  if(r.ok){
   A.busy=false;A.dirty=false;draftRestored=false;
   try{localStorage.removeItem(DRAFT)}catch(e){}
   A.msg='';renderAdmin();toast('Publié ✓ — Pages met ~1 min à afficher la nouveauté');
   return;
  }
  return r.json().catch(function(){return {}}).then(function(j){throw {status:r.status,json:j}});
 }).catch(function(e){
  A.busy=false;var st=e&&e.status;
  if(st===401||st===403)A.msg='Token refusé (401/403). Vérifie le token : fine-grained, accès au repo, permission « Contents: Read and write ».';
  else if(st===404)A.msg='Repo, branche ou chemin introuvable (404). Vérifie owner, repo, branche et « index.html ».';
  else if(st===409||st===422)A.msg='La version sur GitHub a changé entre-temps. Recharge la page puis republie.';
  else A.msg='La publication a échoué'+(st?' (HTTP '+st+')':'')+'. Vérifie ta connexion et réessaie.';
  renderAdmin();
 });
}

  };

  im.src=u;

}
function saveForm(){
 readForm();var e=A.ed,price=Number(e.price),old=Number(e.old);
 if(!e.name.trim()){A.msg='Le nom est obligatoire.';return renderAdmin()}
 if(!(price>0)){A.msg='Indique un prix supérieur à 0.';return renderAdmin()}
 var o={id:e.id,name:e.name.trim(),cat:(e.cat||'').trim()||'Divers',price:price,old:old>price?old:0,sizes:e.sizes.split(',').map(function(s){return s.trim().toUpperCase()}).filter(Boolean),desc:e.desc.trim(),out:e.out==='1',imgs:e.imgs};
 var i=S.products.findIndex(function(p){return p.id===o.id});
 if(i>=0)S.products[i]=o;else S.products.unshift(o);
 A.dirty=true;A.view='list';A.ed=null;A.msg='';persistDraft();renderShop();renderAdmin();toast('Produit enregistré');
}
var RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
 var t=ev.target;
 var cp=t.closest('[data-copy]');if(cp){copy(cp.getAttribute('data-copy'),cp);return}
 var ct=t.closest('[data-cat]');if(ct){cat=ct.getAttribute('data-cat');renderShop();return}
 var cd=t.closest('.card');if(cd){openModal(cd.getAttribute('data-id'));return}
 if(t.id==='modal'){closeModal();return}
 var b=t.closest('[data-a]');if(!b)return;
 var a=b.getAttribute('data-a'),id=b.getAttribute('data-id'),i=Number(b.getAttribute('data-i'));
 if(a==='closeModal')closeModal();
 else if(a==='thumb'){M.i=i;renderModal()}
 else if(a==='size'){M.size=b.getAttribute('data-s');renderModal()}
 else if(a==='openAdmin'){A.open=true;A.view='list';A.msg='';renderAdmin();admin.hidden=false}
 else if(a==='closeAdmin'){admin.hidden=true;A.open=false;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
 else if(a==='new'){A.ed={id:uid(),isNew:true,name:'',cat:'',price:'',old:'',sizes:'S, M, L, XL',desc:'',out:'0',imgs:[]};A.view='form';A.msg='';renderAdmin()}
 else if(a==='edit'){var p=S.products.filter(function(x){return x.id===id})[0];if(p){A.ed=toEd(p);A.view='form';A.msg='';renderAdmin()}}
 else if(a==='del'){
  if(A.del===id){S.products=S.products.filter(function(x){return x.id!==id});A.del=null;A.dirty=true;persistDraft();renderShop()}else A.del=id;
  renderAdmin();
 }
 else if(a==='cancel'){A.view='list';A.ed=null;A.msg='';renderAdmin()}
 else if(a==='save')saveForm();
 else if(a==='rmimg'){readForm();A.ed.imgs.splice(i,1);renderAdmin()}
 else if(a==='first'){readForm();var s=A.ed.imgs.splice(i,1)[0];A.ed.imgs.unshift(s);renderAdmin()}
 else if(a==='publish')publish();
 else if(a==='saveGh'){readGhForm();toast('Réglages enregistrés')}
 else if(a==='testGh')testGh();
 else if(a==='saveSetup'){var c=readGhForm();if(!c.owner||!c.repo||!c.token){A.msg='عمر owner + repo + token كاملين.';return renderAdmin()}A.skipSetup=false;A.msg='';toast('Connecté à GitHub ✓');renderAdmin()}
 else if(a==='testSetup')testGh();
 else if(a==='skipSetup'){A.skipSetup=true;A.msg='';renderAdmin()}
 else if(a==='relock'){A.unlocked=false;A.msg='';try{sessionStorage.removeItem('s1309_ok')}catch(e){}admin.hidden=true;A.open=false;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
 else if(a==='discardDraft'){try{localStorage.removeItem(DRAFT)}catch(e){};S.products=embeddedProducts.slice();draftRestored=false;A.dirty=false;cat='Tout';A.msg='';renderShop();renderAdmin();toast('Version publiée restaurée')}
});
admin.addEventListener('submit',function(ev){
 if(!ev.target||ev.target.id!=='lockform')return;ev.preventDefault();
 var inp=$('#ad-pass'),code=String(inp&&inp.value||'').trim();
 sha256Hex(code).then(function(h){
  if(h===ADMIN_HASH){A.unlocked=true;try{sessionStorage.setItem('s1309_ok','1')}catch(e){}A.msg='';A.view='list';renderAdmin()}
  else{A.msg='Code incorrect.';renderAdmin();var i=$('#ad-pass');if(i){i.focus();i.select()}}
 });
});
admin.addEventListener('change',function(ev){
 if(ev.target.id!=='f-files'||!A.ed)return;
 var files=Array.prototype.slice.call(ev.target.files||[]);if(!files.length)return;
 readForm();A.loading=true;A.msg='';renderAdmin();
 var room=Math.max(0,6-A.ed.imgs.length);
 Promise.all(files.slice(0,room).map(function(f){return shrink(f).catch(function(){return null})})).then(function(r){
  r.forEach(function(s){if(s)A.ed.imgs.push(s)});
  if(files.length>room)A.msg='6 photos maximum par produit.';
  A.loading=false;renderAdmin();
 });
});
document.addEventListener('keydown',function(ev){
 if(ev.key!=='Escape')return;
 if(!$('#modal').hidden)closeModal();else if(!admin.hidden){admin.hidden=true;A.open=false}
});

renderShop();

/* secret entry: the #admin hash opens the admin drawer — no button anywhere on the visible page */
function openAdminIfHash(){
 if(String(location.hash||'').replace('#','').toLowerCase()!=='admin')return;
 A.open=true;A.view='list';A.msg='';renderAdmin();admin.hidden=false;
}
window.addEventListener('hashchange',openAdminIfHash);
openAdminIfHash();
})();
</script></body></html>
